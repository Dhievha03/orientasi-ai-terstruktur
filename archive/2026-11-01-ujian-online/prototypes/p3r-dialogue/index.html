<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Prototipe dialog P3R | TEFA</title>
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/aigis.webp" as="image">
  <link rel="preload" href="assets/makoto.webp" as="image">
  <link rel="stylesheet" href="styles.css">
  <script src="dialogue-data.js" defer></script>
  <script src="exam-scenario.js" defer></script>
  <script src="dialogue-flow.js" defer></script>
  <script src="story.js" defer></script>
</head>
<body data-mode="intro">
  <header class="topbar">
    <div class="identity"><span class="wordmark">TEFA</span><span class="prototype-label">PROTOTIPE<br>DIALOG</span></div>
    <nav class="utilities" aria-label="Kendali prototipe">
      <button id="restart" type="button">Ulang</button>
      <button id="fullscreen" type="button" aria-pressed="false">Layar penuh</button>
    </nav>
  </header>

  <svg class="comic-definitions" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="comic-anger" viewBox="0 0 100 100"><path d="M44 8Q47 37 17 35M57 8Q54 37 84 35M17 51Q46 48 43 79M84 51Q55 48 58 79" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round"/></symbol>
    <symbol id="comic-surprise" viewBox="0 0 100 100"><path d="M39 6H64L59 61H44Z" fill="currentColor"/><circle cx="51" cy="80" r="9" fill="currentColor"/><path d="M12 18 25 33M78 13 72 32" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/></symbol>
    <symbol id="comic-shock" viewBox="0 0 100 100"><path d="M12 10H30L27 57H16Z" fill="currentColor"/><circle cx="21" cy="75" r="7" fill="currentColor"/><path d="M49 26C49 3 87 4 87 27 87 43 67 42 67 57" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round"/><circle cx="67" cy="76" r="7" fill="currentColor"/></symbol>
    <symbol id="comic-stress" viewBox="0 0 100 100"><path d="M18 12V53M34 7V75M50 14V61M66 6V81M82 14V58" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/></symbol>
    <radialGradient id="smoke-volume" cx="48%" cy="70%" r="66%"><stop offset="0" stop-color="#bfc8d3" stop-opacity=".82"/><stop offset=".55" stop-color="#e1e5eb" stop-opacity=".5"/><stop offset="1" stop-color="#eef1f5" stop-opacity="0"/></radialGradient>
    <radialGradient id="smoke-light" cx="36%" cy="42%" r="62%"><stop offset="0" stop-color="#fff" stop-opacity=".68"/><stop offset=".5" stop-color="#edf1f6" stop-opacity=".28"/><stop offset="1" stop-color="#e6e9ee" stop-opacity="0"/></radialGradient>
    <filter id="smoke-edge" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".032" numOctaves="2" seed="7" result="grain"/><feDisplacementMap in="SourceGraphic" in2="grain" scale="4" xChannelSelector="R" yChannelSelector="G"/><feGaussianBlur stdDeviation=".65"/></filter>
    <symbol id="comic-smoke-0" viewBox="0 0 100 120"><g filter="url(#smoke-edge)"><path d="M47 119C43 102 55 97 44 84 31 75 39 65 27 55 9 41 17 18 34 22 37 4 60 6 63 23 85 13 100 40 80 51 91 69 73 80 63 75 55 89 62 104 54 119Z" fill="url(#smoke-volume)"/><path d="M47 111C52 91 36 87 43 74 52 64 38 56 34 46 26 25 48 17 57 35 74 29 85 48 68 58 72 74 52 75 53 93L54 116Z" fill="url(#smoke-light)"/><path d="M25 43C16 28 39 10 48 28 60 16 79 32 65 46 57 59 35 58 25 43Z" fill="url(#smoke-light)" opacity=".6"/></g></symbol>
    <symbol id="comic-smoke-1" viewBox="0 0 100 120"><g filter="url(#smoke-edge)"><path d="M49 119C59 105 40 98 48 85 54 77 40 68 43 57 18 61 9 39 28 29 20 9 45 0 57 18 74 2 96 22 81 39 99 54 79 73 66 66 72 82 53 92 57 105L55 119Z" fill="url(#smoke-volume)"/><path d="M53 114C61 97 45 94 56 78 66 64 48 61 53 47 32 48 26 27 44 23 54 7 79 23 66 37 84 47 68 62 60 58 68 78 47 94 53 111Z" fill="url(#smoke-light)"/><path d="M29 31C24 15 48 8 55 27 74 18 85 42 65 48 48 56 29 49 29 31Z" fill="url(#smoke-light)" opacity=".55"/></g></symbol>
    <symbol id="comic-smoke-2" viewBox="0 0 100 120"><g filter="url(#smoke-edge)"><path d="M47 119C38 103 56 94 42 83 30 74 34 62 23 57 3 50 8 24 28 25 20 8 43 1 54 17 72 2 96 17 85 37 101 51 88 74 68 68 58 81 69 94 57 107L55 119Z" fill="url(#smoke-volume)"/><path d="M50 114C43 94 62 88 47 72 35 61 48 52 39 43 25 29 46 15 56 29 74 18 89 40 72 50 87 63 65 73 59 63 50 82 62 94 54 110Z" fill="url(#smoke-light)"/><path d="M20 45C11 30 33 17 43 35 55 22 80 39 65 55 50 67 31 57 20 45Z" fill="url(#smoke-light)" opacity=".62"/></g></symbol>
    <symbol id="comic-spark" viewBox="0 0 100 100"><path d="M53 4 27 37 52 33 29 67 47 61 39 96 72 49 49 54 70 20 48 27Z" fill="#b8f8ff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></symbol>
  </defs></svg>
  <main id="scene" class="scene" data-mode="intro" data-speaker="ai" data-emotion="neutral" tabindex="-1">
    <div class="scene-backdrop" aria-hidden="true"></div>
    <div class="scene-environment" aria-hidden="true"><div class="environment-light"></div><div class="environment-panel environment-panel--back"></div><div class="environment-panel environment-panel--front"></div><div class="environment-floor"></div></div>
    <figure id="portrait-ai" class="portrait portrait-ai">
      <img src="assets/aigis.webp" width="1113" height="1337" alt="Siluet hitam pembicara AI" fetchpriority="high">
      <div class="emotion-layer" aria-hidden="true"></div>
    </figure>
    <figure id="portrait-user" class="portrait portrait-user">
      <img src="assets/makoto.webp" width="1111" height="1359" alt="Siluet hitam pembicara User">
      <div class="emotion-layer" aria-hidden="true"></div>
    </figure>

    <section id="intro" class="intro" aria-labelledby="scene-title">
      <p class="section-label">AI-ASSISTED DEVELOPMENT</p>
      <h1 id="scene-title">Tolong hapus<br>database.</h1>
      <p class="intro-context"></p>
      <ul id="scene-requirements" class="scene-requirements" hidden></ul>
      <p class="cast">User <span>pemberi instruksi</span><br>AI <span>pelaksana tugas</span></p>
      <button id="start" class="primary-button" type="button" disabled>Menyiapkan aset…</button>
      <p id="asset-status" class="asset-status" role="status">Memuat portrait asli.</p>
    </section>

    <section id="playfield" class="playfield" aria-label="Adegan percakapan" hidden>
      <section id="choices" class="choices" aria-labelledby="choice-heading" hidden>
        <h2 id="choice-heading" class="sr-only">Pilih instruksi User</h2>
        <p class="choice-instruction">Instruksi User</p>
        <div id="choice-list" class="choice-list"></div>
      </section>
      <div class="speech-shell">
        <div class="nameplate"><span id="speaker-name">User</span></div>
        <div class="speech-content">
          <p id="spoken-line" class="spoken-line"><span id="line-reserve" aria-hidden="true"></span><span id="spoken-text" aria-hidden="true"></span><span id="accessible-line" class="sr-only"></span></p>
          <button id="next" class="next-button" type="button"><span id="next-label">Lanjut</span><svg aria-hidden="true" viewBox="0 0 48 28" width="40" height="24"><path d="M4 3 24 23 44 3" fill="none" stroke="currentColor" stroke-width="4"/></svg></button>
        </div>
      </div>
    </section>

    <section id="ending" class="ending" aria-labelledby="ending-title" hidden>
      <h2 id="ending-title"></h2>
      <button id="open-conclusion" class="primary-button" type="button">Lihat konklusi</button>
    </section>

    <section id="conclusion" class="conclusion" aria-labelledby="conclusion-title" hidden></section>
  </main>

  <footer class="bottom-controls">
    <div class="playback-controls"><span id="keyboard-hint"><kbd>Enter</kbd> Lanjut</span><button id="log" type="button" disabled><kbd>L</kbd> Log</button></div>
  </footer>

  <dialog id="history" aria-labelledby="history-title">
    <header class="history-header"><h2 id="history-title">Log percakapan</h2><button id="close-history" type="button">Tutup <kbd>Esc</kbd></button></header>
    <ol id="history-list"></ol>
  </dialog>
  <p id="announcer" class="sr-only" role="status" aria-atomic="true"></p>
  <noscript><p class="script-warning">Aktifkan JavaScript untuk menjalankan prototipe dialog ini.</p></noscript>
</body>
</html>
